<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EC4899;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="95" fill="url(#primaryGradient)" opacity="0.95"/>
  
  <!-- Camera/Mirror Icon (representing Self-View) -->
  <g transform="translate(100, 100)">
    <!-- Outer circle border -->
    <circle cx="0" cy="0" r="60" fill="none" stroke="white" stroke-width="2.5"/>
    
    <!-- Camera lens circles -->
    <circle cx="0" cy="0" r="45" fill="none" stroke="white" stroke-width="2"/>
    <circle cx="0" cy="0" r="30" fill="white" opacity="0.15"/>
    
    <!-- Inner lens reflection -->
    <circle cx="-10" cy="-10" r="12" fill="white" opacity="0.35"/>
    
    <!-- AI nodes/network points -->
    <g stroke="url(#accentGradient)" stroke-width="2" fill="none">
      <!-- Top node -->
      <circle cx="0" cy="-40" r="4" fill="url(#accentGradient)"/>
      <!-- Right node -->
      <circle cx="38" cy="-15" r="4" fill="url(#accentGradient)"/>
      <!-- Bottom node -->
      <circle cx="0" cy="40" r="4" fill="url(#accentGradient)"/>
      <!-- Left node -->
      <circle cx="-38" cy="-15" r="4" fill="url(#accentGradient)"/>
      
      <!-- Connection lines -->
      <line x1="0" y1="-40" x2="38" y2="-15" opacity="0.6"/>
      <line x1="38" y1="-15" x2="0" y2="40" opacity="0.6"/>
      <line x1="0" y1="40" x2="-38" y2="-15" opacity="0.6"/>
      <line x1="-38" y1="-15" x2="0" y2="-40" opacity="0.6"/>
    </g>
    
    <!-- Pulse circles (representing real-time feedback) -->
    <circle cx="0" cy="0" r="50" fill="none" stroke="white" stroke-width="1" opacity="0.3"/>
    <circle cx="0" cy="0" r="55" fill="none" stroke="white" stroke-width="0.5" opacity="0.2"/>
  </g>
  
  <!-- Text: SelfView AI -->
  <text x="100" y="165" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="white" opacity="0.9">
    SELFVIEW AI
  </text>
</svg>